[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pledge-keystone"
version = "0.8.0"
description = "Pledge Keystone: a local-first agent kernel that keeps its promises (contracts, permissions, acceptance checks)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
keywords = ["agent", "framework", "orchestration", "self-iteration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
secrets = ["PyYAML>=6,<7", "tomli>=2; python_version < '3.11'"]

[project.scripts]
keystone = "keystone.cli:main"
# 旧命令名，兼容改名前的脚本与习惯
forge = "keystone.cli:main"

[project.urls]
Homepage = "https://github.com/suyunpledge/pledge-keystone"

[tool.setuptools.packages.find]
include = ["keystone", "keystone.*"]

[tool.setuptools.package-data]
keystone = ["contrib/*.py", "contrib/*.md", "contrib/*.json",
         "bundles/*.json", "bundles/modes/*.json",
         "templates/*.py", "templates/*.json",
         "bundled/*/*.md", "bundled/*/*.json"]
