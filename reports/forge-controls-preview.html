<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge 按钮与色彩预览</title><style>
:root{--bg: #11131B;
--activity: #0D1018;
--sidebar: #171B25;
--sidebar-history: #131720;
--chat: #11131B;
--surface: #202636;
--surface2: #191F2D;
--surface-subtle: #1A2030;
--hover: #283248;
--sel: #2C2B4C;

--black: #000000;
--border: #2C3446;

--scroll: #45516B;

--accent-hover: #6962E3;
--accent-pressed: #4B45BC;
--accent2: #A19BFF;
--accent-soft: #292645;

--brand-ice: #BDCAFF;
--brand-spark: #F5BC74;
--ok: #22C55E;
--ok-pressed: #16A34A;
--ok-soft: #132C1C;

--error-soft: #321C2A;
--info: #A19BFF;
--info-soft: #25243C;

--link-soft: #25243C;

--body: #D5DCEE;
--subtext: #ABB5CD;
--muted: #A2ADC5;
--ter: #A2ADC5;
--placeholder: #A2ADC5;

--msg-agent-fg: #E8ECFA;
--msg-user-bg-old: #232134;
--msg-agent-bg-old: #1A1A22;

--msg-agent-border: #45516C;

--git-d: #EF4444;
--git-u: #7C7CF0;}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--body);font:14px "Segoe UI","Microsoft Yahei UI",sans-serif}
main{max-width:1120px;margin:auto;padding:36px 32px}header{display:flex;align-items:center;gap:12px}header img{width:36px;height:36px}
h1{font-size:24px;margin:0;color:var(--text)}.eyebrow{font-size:10px;letter-spacing:3px;color:var(--accent-text);margin-bottom:4px}
p{color:var(--subtext);line-height:1.7;margin:14px 0 22px}h2{font-size:15px;color:var(--text);margin:0 0 22px}
section{border:1px solid var(--border);background:var(--surface2);padding:24px;margin:20px 0;border-radius:12px}
.grid{display:grid;grid-template-columns:74px repeat(5,minmax(0,1fr));gap:16px 14px;align-items:center}.grid small{color:var(--muted);font-size:11px}
.role{color:var(--subtext);font-size:12px}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-hi);background:var(--surface2);color:var(--body);padding:9px 11px;font:13px inherit;min-height:38px;cursor:pointer;border-radius:3px;white-space:nowrap}
button svg{width:18px;height:18px;flex:none}.primary{background:var(--accent);border-color:var(--accent-border);color:white}.primary.hover,.primary:hover{background:var(--accent-hover);border-color:var(--accent2)}
.primary.pressed,.primary:active{background:var(--accent-pressed);border-color:var(--accent2)}
.secondary.hover,.secondary:hover{background:var(--hover);color:var(--text)}.secondary.pressed,.secondary:active{background:var(--control-pressed);color:var(--text)}
.danger{color:var(--error)}.danger.hover,.danger:hover,.danger.pressed,.danger:active{background:var(--error-soft);border-color:var(--error)}
.focused,button:focus-visible{border-color:var(--focus-ring)!important;outline:1px solid var(--focus-ring);outline-offset:2px}
button.disabled,button:disabled{background:var(--disabled-bg)!important;color:var(--disabled-fg)!important;border-color:var(--disabled-border)!important;cursor:default;outline:none}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.planning{color:var(--warn);border-color:var(--warn);background:var(--input-bg)}
.team{color:var(--accent-text);border-color:var(--accent-border);background:var(--input-bg)}.planning:hover,.team:hover{background:var(--hover)}.planning:active,.team:active{background:var(--control-pressed)}
.planning:focus-visible{border-color:var(--warn)!important;outline-color:var(--warn)}.muted{color:var(--muted);font-size:12px}.sample{background:var(--input-bg);border:1px solid var(--border-hi);border-radius:9px;padding:20px}
.swatches{display:flex;gap:16px;flex-wrap:wrap}.swatch{display:flex;align-items:center;gap:10px;flex:1;min-width:150px}.paint{width:32px;height:32px;border-radius:7px;border:1px solid var(--border-hi)}.swatch small{display:block;margin-top:5px;color:var(--muted);font-size:10px}
footer{color:var(--muted);font-size:11px;line-height:1.8}output{display:block;font-size:12px;color:var(--subtext);margin-top:16px;min-height:18px}
@media(max-width:800px){.grid{overflow:auto;grid-template-columns:74px repeat(5,160px)}main{padding:24px 16px}}
