<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' qrc:; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>办公</title>
    <link rel="stylesheet" href="office.css" />
    <script defer src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script defer src="charts.js"></script>
    <script defer src="slides.js"></script>
    <script defer src="office.js"></script>
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z" /><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z" /></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></symbol>
      <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 15v4h14v-4" /></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z" /></symbol>
      <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 15V3M7 10l5 5 5-5M5 15v4h14v-4" /></symbol>
      <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5M12 8v4l3 2" /></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></symbol>
      <symbol id="i-cell" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1" /><path d="M3 10h18M9 5v14" /></symbol>
    </svg>

    <main id="home">
      <section class="hero">
        <p class="eyebrow">revon Office</p>
        <h1>今天要完成哪份文件？</h1>
        <p class="lead">在本地创建文档、表格和演示。你和 revon 编辑同一份文件，每处 AI 修改都可以审阅和撤销。</p>
        <form id="homeAsk" class="prompt">
          <svg class="i spark"><use href="#i-spark" /></svg>
          <input
            aria-label="让 AI 创建办公文件"
            placeholder="让 revon 创建一份报告、表格或演示…"
          /><button class="primary round" aria-label="发送">
            <svg class="i"><use href="#i-send" /></svg>
          </button>
        </form>
      </section>
      <div class="cards">
        <button data-create="document">
          <b class="type document">W</b><strong>空白文档</strong
          ><small>报告、方案、会议纪要</small>
        </button>
        <button data-create="spreadsheet">
          <b class="type spreadsheet">X</b><strong>空白表格</strong
          ><small>数据、计算与汇总</small>
        </button>
        <button data-create="presentation">
          <b class="type presentation">P</b><strong>空白演示</strong
          ><small>幻灯片与汇报</small>
        </button>
        <button id="pick">
          <b class="type import"><svg class="i"><use href="#i-import" /></svg></b
          ><strong>导入文件</strong
          ><small>docx · xlsx · pptx · md · csv，生成可编辑副本</small>
        </button>
      </div>
      <h2 class="section-title">最近文件</h2>
      <div id="recent"></div>
    </main>

    <section id="editor" hidden>
      <header>
        <button id="back" class="ghost" aria-label="返回办公主页">
          <svg class="i"><use href="#i-back" /></svg>办公
        </button>
        <b id="kindIcon" class="type"></b
        ><input id="title" data-field="title" aria-label="文件名" maxlength="120" />
        <span id="saveState" class="save" role="status"></span>
        <span class="spacer"></span>
        <button id="undo" class="ghost">
          <svg class="i"><use href="#i-undo" /></svg>撤销我的编辑
        </button>
        <button id="export" class="primary">
          <svg class="i"><use href="#i-export" /></svg>导出
        </button>
      </header>
      <nav id="toolbar">
        <button id="add" class="ghost"></button
        ><select id="style" aria-label="段落样式">
          <option value="paragraph">正文</option>
          <option value="heading">标题</option>
          <option value="bullet">项目符号</option>
        </select>
        <label id="sheetAddress" hidden
          ><svg class="i"><use href="#i-cell" /></svg>
          <input id="cellAddress" value="A1" aria-label="跳转到单元格" /><button
            id="goCell"
            class="ghost"
          >
            转到
          </button></label
        >
        <!-- charts.js / slides.js rewrite these labels, so they stay text-only. -->
        <button id="chartDesign" class="ghost" hidden>插入图表</button>
        <div id="slideTools" hidden>
          <label>版式 <select id="slideLayout"><option value="content">标题正文</option><option value="cover">封面</option><option value="columns">双栏对照</option></select></label>
          <label>主题 <select id="slideTheme"><option value="paper">暖白</option><option value="midnight">深海</option><option value="sage">青瓷</option></select></label>
          <label>切换 <select id="slideTransition"><option value="none">无</option><option value="fade">淡入</option></select></label>
          <button id="editSlideTable" class="ghost" type="button">插入表格</button>
        </div>
        <span class="spacer"></span>
        <button id="play" class="ghost" hidden title="从当前页放映 · Shift+F5">
          <svg class="i"><use href="#i-play" /></svg>从当前页放映
        </button>
        <button id="playStart" class="ghost" hidden title="从头放映 · F5">从头放映</button>
        <button id="aiToggle" class="ghost ai" aria-expanded="true">
          <svg class="i"><use href="#i-spark" /></svg>revon
        </button>
      </nav>
      <div class="desk">
        <aside id="outline"></aside>
        <div id="canvas"></div>
        <aside id="collab" aria-label="revon 协作">
          <div class="collab-head">
            <h2><svg class="i spark"><use href="#i-spark" /></svg>revon</h2>
            <div class="segmented" role="radiogroup" aria-label="AI 写入模式">
              <button type="button" role="radio" data-mode="suggest" title="AI 的修改需要你确认后才生效">建议</button
              ><button type="button" role="radio" data-mode="direct" title="AI 的修改立即生效，可按作者撤销">直接编辑</button>
            </div>
            <select id="mode" hidden aria-hidden="true" tabindex="-1">
              <option value="suggest">建议</option>
              <option value="direct">直接编辑</option>
            </select>
          </div>
          <div class="selection" id="selection">上下文 · 整份文件</div>
          <form id="ask" class="composer">
            <textarea
              placeholder="描述想要的修改，例如：把第二节改得正式一点"
              aria-label="AI 编辑要求"
            ></textarea>
            <div class="composer-row">
              <span>选中段落或单元格可缩小范围</span
              ><button class="primary round" aria-label="发送给 revon">
                <svg class="i"><use href="#i-send" /></svg>
              </button>
            </div>
          </form>
          <div id="agentState" role="status"></div>
          <h3>待处理建议 <span id="proposalCount" class="count"></span></h3>
          <div id="proposals"></div>
          <details>
            <summary><svg class="i"><use href="#i-history" /></svg>编辑历史</summary>
            <div id="history"></div>
          </details>
          <button id="undoAI" class="ghost wide">
            <svg class="i"><use href="#i-undo" /></svg>撤销 revon 的上一次修改
          </button>
        </aside>
      </div>
      <footer>
        <span id="detail"></span><span class="hint">Ctrl+S 立即保存</span>
      </footer>
    </section>

    <div id="message" role="status" hidden>
      <span></span><button id="dismiss" aria-label="关闭提示">×</button>
    </div>
    <dialog id="conflict">
      <h2>同一字段有更新</h2>
      <p>本地草稿和最新保存的内容不同。</p>
      <div class="dialog-actions">
        <button id="useLatest">采用已保存内容</button
        ><button id="useDraft" class="primary">保存我的草稿</button>
      </div>
    </dialog>
    <dialog id="chartDialog" aria-labelledby="chartHeading">
      <form id="chartForm">
        <h2 id="chartHeading">图表设计</h2>
        <label>数据来源<select name="source"><option value="cells">工作表区域</option><option value="function">函数</option></select></label>
        <fieldset id="rangeSource"><legend>同一工作表内的数值列</legend>
          <label>X 区域<input name="xRange" required placeholder="A2:A12"></label>
          <label>Y 区域<input name="yRange" required placeholder="B2:B12"></label>
        </fieldset>
        <fieldset id="functionSource"><legend>y = f(x)</legend>
          <label>函数解析式<input name="expression" required maxlength="256" placeholder="sin(x)"></label>
          <label>起点<input name="min" type="number" step="any" required></label>
          <label>终点<input name="max" type="number" step="any" required></label>
        </fieldset>
        <label>图表标题<input name="title" maxlength="80"></label>
        <label>横轴标题<input name="xTitle" maxlength="80"></label>
        <label>纵轴标题<input name="yTitle" maxlength="80"></label>
        <label>图表类型<select name="style"><option value="line">连线散点图</option><option value="scatter">散点图</option></select></label>
        <label>系列颜色<input name="color" type="color"></label>
        <label>显示数值标签<input name="labels" type="checkbox"></label>
        <p id="chartError" role="alert" hidden></p>
        <div class="chart-actions"><button type="button" id="removeChart">移除图表</button><span class="spacer"></span><button type="button" id="closeChart">取消</button><button class="primary">应用</button></div>
      </form>
    </dialog>
    <dialog id="slideTableDialog" aria-labelledby="tableHeading">
      <h2 id="tableHeading">演示表格</h2>
      <div class="table-controls"><button id="rowPlus">加行</button><button id="rowMinus">减行</button>
        <button id="colPlus">加列</button><button id="colMinus">减列</button></div>
      <div id="tableInputs"></div><p id="tableError" role="alert" hidden></p>
      <div class="table-controls"><button id="removeSlideTable">移除表格</button><span class="spacer"></span>
        <button id="closeSlideTable">取消</button><button class="primary" id="saveSlideTable">应用</button></div>
    </dialog>
    <dialog id="presentation" aria-label="幻灯片放映">
      <div id="screen"></div>
      <div class="show-controls">
        <button id="prevSlide">上一页</button
        ><output id="showPosition" aria-live="polite"></output><button id="nextSlide">下一页</button
        ><button id="endShow" class="primary">结束放映</button>
      </div>
    </dialog>
  </body>
</html>
